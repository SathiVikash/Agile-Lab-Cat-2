apiVersion: apps/v1
kind: Deployment
metadata:
name: Rivera-Events
spec:
replicas: 2
selector:
matchLabels:
app: Rivera-Events
template:
metadata:
labels:
app: Rivera-Events
spec:
containers:
- name: Rivera-Events
image: sathivikash/Rivera-Events:latest
ports:
- containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
name: Rivera-Events-service
spec:
type: NodePort
selector:
app: Rivera-Events
ports:
- port: 80
targetPort: 80
nodePort: 30010
